# Publie la version web (dossier dist/) sur GitHub Pages à chaque modification.
name: Publier la version web
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'supabase/**', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Numéro de version (nombre de modifications du code)
        run: |
          n=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$n" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$n" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Construire
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
