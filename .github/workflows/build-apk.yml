# Compile l'APK, le signe et publie une « Release » (lue par Obtainium) à chaque modification.
name: Construire l'APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'supabase/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Préparer l'appli web
        run: node build.js
      - name: Compiler et signer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -o pipefail
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_B64" ]; then
            echo "Secrets KEYSTORE_B64 et/ou KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)." | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/release.p12
          cd android && gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Suvess-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          git log -1 --pretty=%B > notes.md
          gh release create "v$VERSION_NAME" "$apk" --title "Suvess $VERSION_NAME" --notes-file notes.md --target "$GITHUB_SHA"
      - name: Garder le journal en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "pas de journal de compilation" > /tmp/log/build.log
          cd /tmp/log && git init -q && git checkout -q -b ci-logs && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Échec du build ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-logs
