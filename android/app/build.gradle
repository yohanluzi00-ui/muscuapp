plugins {
    id 'com.android.application'
}

// Numéro de version fourni par GitHub Actions (numéro du build)
def vCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
def vName = System.getenv("VERSION_NAME") ?: "1.0-dev"

android {
    namespace 'com.muscuapp.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.muscuapp.app'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            storeFile file('../release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'muscuapp'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
